<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Acme Shop - Product Substitute Finder</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header class="hero">
      <h1>Acme Shop</h1>
      <p>Find great substitutes for any product in our catalog.</p>
    </header>

    <main class="container">
      <section class="search">
        <form id="subForm" onsubmit="return runSearch()">
          <input id="pid" placeholder="Enter product SKU (e.g. SKU-000001)" />
          <button type="submit">Find Substitutes</button>
        </form>
        <div id="results"></div>
      </section>

      <section class="samples">
        <h2>Sample SKUs</h2>
        <ul>
          <li><a href="#" onclick="fill('SKU-000000')">SKU-000000</a></li>
          <li><a href="#" onclick="fill('SKU-000001')">SKU-000001</a></li>
          <li><a href="#" onclick="fill('SKU-000010')">SKU-000010</a></li>
        </ul>
      </section>
    </main>

    <script>
      async function runSearch(){
        const pid = document.getElementById('pid').value;
        if(!pid) return false;
        const r = await fetch('/substitute/' + encodeURIComponent(pid));
        const data = await r.json();
        const out = document.getElementById('results');
        if(!Array.isArray(data)){
          out.innerText = JSON.stringify(data);
          return false;
        }
        out.innerHTML = '<h3>Substitutes</h3>' + data.map(d => `<div class="card"><strong>${d.product_id}</strong> ${d.name} <span class="muted">score ${d.score.toFixed(3)}</span></div>`).join('');
        return false;
      }
      function fill(sku){ document.getElementById('pid').value = sku; }
    </script>
  </body>
</html>
