<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Shoply — Recommendations</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="hero">
    <h1>Shoply</h1>
    <p class="tag">Personalised product recommendations powered by Azure DocumentDB vector search</p>
  </header>
  <main>
    <section class="search">
      <label for="productId">Enter product ID (e.g. P0..P9999)</label>
      <input id="productId" placeholder="P123" />
      <button id="go">Recommend</button>
    </section>
    <section id="results" class="results"></section>
  </main>

  <footer>Sample UI — not a real store</footer>

  <script>
    document.getElementById('go').addEventListener('click', async () => {
      const pid = document.getElementById('productId').value.trim();
      const results = document.getElementById('results');
      results.innerHTML = 'Loading...';
      const res = await fetch('/api/recommend', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ productId: pid }) });
      if (!res.ok) {
        results.innerHTML = 'Error: ' + (await res.text());
        return;
      }
      const data = await res.json();
      results.innerHTML = `<h2>Top recommendations for ${pid}</h2>` +
        `<p class="explain">${data.explanation}</p>` +
        `<ol>` + data.recommendations.map(r => `<li>${r.productId} — ${r.title}</li>`).join('') + `</ol>`;
    });
  </script>
</body>
</html>
